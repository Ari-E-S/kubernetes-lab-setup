---

- name: Check current cluster node count
  kubernetes.core.k8s_info:
    kind: Node
  register: cluster_nodes

- name: Deploy Cilium chart inside kube-system namespace
  kubernetes.core.helm:
    name: cilium
    chart_ref: oci://quay.io/cilium/charts/cilium
    release_namespace: kube-system
    create_namespace: true
    wait: true
    wait_timeout: 15m
    values:
      version: 1.19.2
      kubeProxyReplacement: true
      k8sServiceHost: "{{ ansible_facts['eth1']['ipv4']['address'] | default(ansible_facts['eth0']['ipv4']['address']) }}"
      k8sServicePort: 6443
      hubble:
        enabled: true
        ui:
          enabled: true
        relay:
          enabled: true
        tls:
          auto:
            enabled: true
            method: cronJob
      certgen:
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/master
            operator: Exists
      operator:
        # Scale down to 1 on single node clusters or 2 otherwise
        replicas: "{{ (cluster_nodes.resources | length > 1) | ternary(2, 1) | int }}"
